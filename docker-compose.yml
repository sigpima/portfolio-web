# Portfolio web (Next.js). nginx chạy trên host, ngoài Docker, nên service này chỉ
# publish một cổng trên 127.0.0.1 (xem deploy/nginx.conf.example và docs/RUNBOOK.md).
#
# Kiến trúc: trình duyệt -> nginx -> web (service này) -> portfolio-api -> chat.
# Web KHÔNG gọi thẳng service `chat` của knowledge_base: mọi lời gọi chat, link mời,
# phiên và trang quản trị đều đi qua portfolio-api (kèm PORTFOLIO_API_KEY). Vì vậy
# service này chỉ gắn vào mạng mặc định của stack portfolio-api, KHÔNG gắn vào mạng
# của knowledge_base (từ container web không với tới được chat:8003 để lách cổng).
#
# Biến môi trường: đặt trong file .env cạnh file này (chép từ .env.example, `chmod 600 .env`,
# KHÔNG BAO GIỜ commit; .env đã nằm trong .gitignore). Mọi lệnh compose ở thư mục này
# (up, logs, exec, cp, stop, down, ...) đều cần PORTFOLIO_API_KEY; thiếu thì (ít nhất up, logs,
# ps) dừng ngay với lỗi "required variable PORTFOLIO_API_KEY is missing a value". Dạng
# `VAR=... docker compose up` chỉ dùng cho một lần chạy thử.
#
# PORTFOLIO_API_KEY phải GIỐNG HỆT giá trị đặt cho portfolio-api (>= 32 ký tự ASCII nhìn
# thấy được). SITE_URL cần cả lúc BUILD và lúc chạy.
#
# Thứ tự bật (mỗi stack có .env riêng): 1. chat của knowledge_base,
# 2. portfolio-api (../api), 3. web (file này: `docker compose up -d --build`).
#
# Mạng: chỉ gắn vào mạng mặc định của stack portfolio-api (portfolio-api_default). Cách kiểm
# tra tên mạng và khi nào cần PORTFOLIO_API_NETWORK: docs/RUNBOOK.md, phần 3.

services:
  portfolio:
    image: portfolio-web:local
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
        REQUIRE_SITE_URL: ${REQUIRE_SITE_URL:-1}
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-3100}:3000"
    environment:
      PORTFOLIO_API_URL: ${PORTFOLIO_API_URL:-http://portfolio-api:8100}
      PORTFOLIO_API_KEY: ${PORTFOLIO_API_KEY:?đặt PORTFOLIO_API_KEY (>= 32 ký tự, cùng giá trị với portfolio-api)}
      SITE_URL: ${SITE_URL:-}
    networks:
      - portfolio_api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Mạng mặc định của stack portfolio-api (mạng ngoài, do stack đó tạo).
  portfolio_api:
    name: ${PORTFOLIO_API_NETWORK:-portfolio-api_default}
    external: true
